[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pangu-ai"
version = "0.1.0"
description = "Local-first, safety-controlled Windows AI operating layer"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10", "pydantic-settings>=2.7", "sqlalchemy>=2.0", "alembic>=1.14", "google-genai>=1.0", "psutil>=6.1", "pycaw>=20240210", "comtypes>=1.4", "screen-brightness-control>=0.24", "numpy>=1.26", "sounddevice>=0.5", "sherpa-onnx>=1.12", "faster-whisper>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14", "httpx>=0.28"]

[project.scripts]
pangu = "pangu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pangu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
addopts = "--basetemp=.pytest-work"

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["E701", "E702"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pangu"]
